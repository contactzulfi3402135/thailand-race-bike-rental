<!doctype html>

    <meta property="og:image" content="/images/bike-yamaha-r9.webp" />

    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 36'><rect width='36' height='36' rx='6' fill='%2308090C'/><path d='M6 27L16 9h6L12 27H6zm11 0l7-12.6L30 27h-6l-2-3.8L19.8 27H17z' fill='%23E62429'/></svg>"

    <!-- High-priority instant preloads: Hero Poster + First 3 Fleet Bikes -->
    <link rel="preload" as="image" href="/images/hero-pov-fallback.webp" type="image/webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/bike-yamaha-r9.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/bike-yamaha-r1m.webp" type="image/webp" />
    <link rel="preload" as="image" href="/images/bike-cbr1000rrr.webp" type="image/webp" />

    <!-- Non-blocking lightweight display & telemetry mono fonts (0ms render block!) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;1,800&family=JetBrains+Mono:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
  </head>
  <body class="bg-[#08090C] text-[#F4F5F7] antialiased selection:bg-[#E62429] selection:text-white" style="margin:0;background:#08090C;color:#F4F5F7;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;">
    <!-- Instant 0.08s Static Shell: Paints immediately before JS bundle even finishes downloading -->
    <div id="root">
      <div style="position:relative;min-height:100svh;width:100%;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;background:#08090C;padding:6rem 1.5rem 3rem;">
        <img
          src="/images/hero-pov-fallback.webp"
          alt="Track POV"
          fetchpriority="high"
          decoding="sync"
          style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;"
        />
        <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,9,12,0.68) 0%,rgba(8,9,12,0.28) 42%,rgba(8,9,12,0.92) 86%,rgba(8,9,12,0.99) 100%);"></div>
        <div style="position:relative;z-index:10;max-width:80rem;width:100%;margin:0 auto;">
          <div style="font-size:12px;font-weight:700;letter-spacing:0.16em;color:#E4E4E7;text-transform:uppercase;margin-bottom:14px;">
            BURIRAM MOTOGP CIRCUIT · BIRA PATTAYA · NAKHON CHAI SI
          </div>
          <h1 style="font-size:clamp(2.4rem,6vw,4.5rem);font-weight:800;line-height:0.96;text-transform:uppercase;color:#FFFFFF;margin:0;max-width:46rem;letter-spacing:-0.02em;">
            ARRIVE AT THE PIT BOX. RIDE FULL RACE SPEC.
          </h1>
          <p style="margin:18px 0 0;font-size:16px;line-height:1.6;color:#E4E4E7;max-width:40rem;">
            Turnkey track-prepared Yamaha R9, R1M, Honda CBR1000RR-R SP &amp; Ducati Panigale V4 S rentals across Thailand. Dedicated race mechanic, enclosed transport, pit box &amp; tire warmers included.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
